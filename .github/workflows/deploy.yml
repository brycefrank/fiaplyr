name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [ main ] # Update this if your default branch is 'master'
  workflow_dispatch:

# Allow the action to push to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./docs # Tells the runner to execute commands inside 'docs'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        # 1. Install R so Rscript is available
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release' # Grabs the latest release. You can pin to a specific version like '4.3.0' if needed.

      - name: Install R dependencies for docs
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::DBI
            any::duckdb
            any::dplyr
            any::pkgload
            local::.

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci # Or 'npm install' depending on your lockfile

      - name: Build Astro project
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/dist # Point exactly to where Astro outputs the build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4